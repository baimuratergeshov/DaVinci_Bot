<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::main}, 'modeles')}">
<head><title th:text="${modele.nom} + ' - Administration'">Modèle - Administration</title></head>
<body>
<main class="page">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h1 class="page-title" th:text="${modele.nom}">Gemini Flash</h1>
            <p class="page-sub">Informations du modèle d’IA.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/admin/modeles}">&larr; Retour à la liste</a>
            <a class="btn btn-primary" th:href="@{/admin/modeles/{id}/modifier(id=${modele.id})}">Modifier</a>
        </div>
    </div>
    <div class="dv-card dv-sheet">
        <div class="d-flex align-items-center gap-3 mb-4">
            <img class="model-logo" th:src="@{${modele.logo}}" width="80" height="80" alt="">
            <div>
                <h2 class="h4 mb-2" th:text="${modele.nom}">Gemini Flash</h2>
                <span class="dv-badge provider" th:text="${modele.fournisseur}">Google</span>
                <span class="dv-badge" th:classappend="${modele.actif} ? 'ok' : 'off'" th:text="${modele.actif} ? 'Actif' : 'Inactif'">Actif</span>
            </div>
        </div>
        <dl class="mb-3">
            <div class="info-row"><dt>Fournisseur</dt><dd th:text="${modele.fournisseur}">Google</dd></div>
            <div class="info-row"><dt>Identifiant technique</dt><dd th:text="${modele.identifiant}">gemini-flash</dd></div>
            <div class="info-row"><dt>URL de l’API</dt><dd th:text="${modele.urlApi}">https://…</dd></div>
            <div class="info-row"><dt>Description</dt><dd th:text="${modele.description}">Description</dd></div>
            <div class="info-row border-bottom"><dt>Ajouté le</dt><dd th:text="${modele.ajouteLe}">10/11/2026</dd></div>
        </dl>
        <button type="button" class="btn btn-danger-soft">Supprimer ce modèle</button>
    </div>
</main>
</body>
</html>
