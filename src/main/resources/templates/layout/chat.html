<!DOCTYPE html>
<!-- Mise en page du chatbot : layout(titre, contenu) -->
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Chatbot - DaVinci Bot</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600&amp;display=swap">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar chat">
        <div th:replace="~{fragments/logo :: complet}"></div>
        <a class="btn btn-primary" th:href="@{/chat}">+ Nouvelle conversation</a>
        <p class="side-label">HISTORIQUE</p>
        <nav class="d-flex flex-column gap-1">
            <a th:each="c : ${conversations}" class="conv" th:classappend="${c.id == conversationId} ? 'active'"
               th:href="@{/chat/{id}(id=${c.id})}">
                <span th:text="${c.titre}">Titre</span>
                <small th:text="${c.modele}">Modèle</small>
            </a>
        </nav>
        <div class="mt-auto side-user">
            <span class="avatar">B</span>
            <div class="lh-sm"><strong>Bay</strong><br><small><a th:href="@{/login}">Se déconnecter</a></small></div>
        </div>
    </aside>
    <div class="app-main" style="height:100vh" th:replace="${content}">Contenu</div>
</div>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
